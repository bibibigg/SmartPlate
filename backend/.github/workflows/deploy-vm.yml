name: Deploy Backend to GCP VM

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # -------------------------------------
      # 🚀 SSH로 GCP VM 접속 후 배포 (appleboy/ssh-action)
      # -------------------------------------
      - name: Deploy to GCP VM
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.GCP_HOST }}
          username: ${{ secrets.GCP_SSH_USER }}
          key: ${{ secrets.GCP_SSH_PRIVATE_KEY }}

          script: |
            echo "🚀 Deploying SmartPlate backend to GCP VM..."

            # 1) 프로젝트 루트 이동 (★ 실제 경로로 수정)
            cd ~/SmartPlate

            # 2) 최신 코드 가져오기
            git pull origin main

            # 3) backend 폴더 이동
            cd backend

            # 4) 의존성 설치 (package-lock.json 기반)
            npm ci --no-audit --no-fund

            # 5) TypeScript 빌드
            npm run build

            # 6) PM2에 애플리케이션 등록되어 있지 않으면 실행
            if ! pm2 describe smart-plate-backend > /dev/null; then
              echo "PM2 프로세스가 없어 새로 시작합니다."
              pm2 start dist/server.js --name smart-plate-backend
            else
              echo "PM2 프로세스가 있어 재시작합니다."
              pm2 restart smart-plate-backend
            fi

            # 7) PM2 프로세스 자동 재시작 & 부팅 등록
            pm2 save
            pm2 startup | tail -n 1 | sudo bash

            echo "✅ Deployment finished successfully!"
