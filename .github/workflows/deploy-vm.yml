name: Deploy Backend to GCP VM

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/deploy-vm.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # -------------------------------------
      # 🚀 SSH로 GCP VM 접속 후 배포
      # -------------------------------------
      - name: Deploy to GCP VM
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.GCP_HOST }}
          username: ${{ secrets.GCP_SSH_USER }}
          key: ${{ secrets.GCP_SSH_PRIVATE_KEY }}
          script_stop: true

          script: |
            #!/bin/bash -l
            set -e

            echo "🚀 Deploying SmartPlate backend to GCP VM..."

            # 환경 파일 로드
            [ -f "$HOME/.bash_profile" ] && source "$HOME/.bash_profile"
            [ -f "$HOME/.profile" ] && source "$HOME/.profile"
            [ -f "$HOME/.bashrc" ] && source "$HOME/.bashrc"

            # NVM 로드
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && source "$NVM_DIR/nvm.sh"

            # 프로젝트 디렉토리로 이동 (없으면 clone)
            if [ ! -d "$HOME/SmartPlate" ]; then
              echo "📦 Cloning repository..."
              cd $HOME
              git clone https://github.com/${{ github.repository }}.git
            fi

            cd $HOME/SmartPlate

            # 최신 코드 가져오기
            echo "📥 Pulling latest code..."
            git fetch origin
            git reset --hard origin/main

            # Backend 폴더로 이동
            cd backend

            # Node.js 버전 확인 및 설정
            if command -v nvm &> /dev/null; then
              nvm use 24.11.1 || nvm install 24.11.1
            fi

            echo "Node: $(node --version) | NPM: $(npm --version)"

            # 의존성 설치
            echo "📦 Installing dependencies..."
            npm ci --no-audit --no-fund

            # TypeScript 빌드
            echo "🏗️ Building TypeScript..."
            npm run build

            # PM2로 배포
            echo "🚀 Deploying with PM2..."
            if ! pm2 describe smart-plate-backend > /dev/null 2>&1; then
              echo "Starting new PM2 process..."
              pm2 start dist/server.js --name smart-plate-backend
            else
              echo "Restarting PM2 process..."
              pm2 restart smart-plate-backend
            fi

            # PM2 설정 저장
            pm2 save

            echo "✅ Deployment finished successfully!"
